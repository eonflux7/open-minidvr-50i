# Builds the standalone Windows converter (weave.py + Python + numpy via PyInstaller, plus ffmpeg.exe) and attaches
# MiniDVR-Convert-windows.zip to the GitHub release when a v* tag is pushed. Run it by hand (Actions tab) to get the
# zip as a build artifact without making a release.
name: Windows converter

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: 9.0.2              # Gyan's essentials build, mirrored on GitHub by GyanD/codexffmpeg
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller and numpy
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3 numpy==2.5.4

      - name: Download ffmpeg
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg.zip has SHA-256 $hash, expected $env:FFMPEG_SHA256" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg

      - name: Build
        run: python -m PyInstaller --noconfirm --onedir --console --name MiniDVR-Convert tools/weave.py

      - name: Assemble the folder
        run: |
          $d = 'dist/MiniDVR-Convert'
          $ff = "ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          Copy-Item "$ff/bin/ffmpeg.exe" $d
          Copy-Item "$ff/LICENSE" "$d/ffmpeg-LICENSE.txt"
          Copy-Item "$ff/README.txt" "$d/ffmpeg-README.txt"
          Copy-Item LICENSE "$d/LICENSE.txt"
          Copy-Item tools/windows-readme.txt "$d/README.txt"

      - name: Smoke test
        run: |
          # finds the bundled ffmpeg (else it stops at "ffmpeg.exe is missing"), reports a missing file in plain words
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          $out = '' | & dist/MiniDVR-Convert/MiniDVR-Convert.exe no-such-recording.avi 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'file not found') { throw 'unexpected output' }
          exit 0

      - name: Zip
        run: Compress-Archive -Path dist/MiniDVR-Convert -DestinationPath MiniDVR-Convert-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MiniDVR-Convert-windows
          path: MiniDVR-Convert-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME MiniDVR-Convert-windows.zip --clobber
